name: Compilar Agora Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Agora --icon assets/logo.ico --add-data 'assets;assets' --hidden-import PySide6.QtSvg main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Agora-v0.1-BLOCK01-Windows
          path: dist/Agora.exe
          if-no-files-found: error
